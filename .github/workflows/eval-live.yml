name: Live Eval Suite (manual)

# Runs the real 23-case end-to-end eval against the live Groq API.
# Triggered manually (not on every push) because it costs real API
# quota and calls the actual agent, not a mock.
on:
  workflow_dispatch:

jobs:
  live-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run end-to-end evaluation suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evaluation.evaluate --delay 4 --json evaluation/results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evaluation/results.json
